
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        env:
          ENVIRONMENT: development
          SMARTPREDICT_DB_PATH: ci-test.db
          INITIAL_ADMIN_PASSWORD: CiAdminBootstrap!2026
          JWT_SECRET_KEY: ci-only-jwt-secret-value-not-for-production
          CSRF_SECRET_KEY: ci-only-csrf-secret-value-not-for-production
        run: python -m pytest tests -q

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
